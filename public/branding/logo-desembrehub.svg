<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="desembre-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="desembre-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F5F3FF" />
      <stop offset="100%" stop-color="#DDD6FE" />
    </linearGradient>
    <linearGradient id="desembre-accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.9" />
    </linearGradient>
    <filter id="desembre-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#desembre-bg-grad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" fill="none" />

  <!-- Monogram & Luxury Bio-Cosmetics "D" Emblem -->
  <g filter="url(#desembre-glow)">
    <!-- Primary Stem of "D" with Modern Facet -->
    <rect x="136" y="128" width="52" height="256" rx="26" fill="url(#desembre-gold-grad)" />
    
    <!-- Outer Arc of "D" with Bio-Curve Cutout -->
    <path d="M162 128 H276 C355.523 128 420 185.308 420 256 C420 326.692 355.523 384 276 384 H162 V332 H276 C326.81 332 368 297.974 368 256 C368 214.026 326.81 180 276 180 H162 V128 Z" fill="url(#desembre-gold-grad)" />

    <!-- Center Bio-Sparkle Core (Biological Excellence Symbol) -->
    <path d="M260 216 C260 238.091 277.909 256 300 256 C277.909 256 260 273.909 260 296 C260 273.909 242.091 256 220 256 C242.091 256 260 238.091 260 216 Z" fill="url(#desembre-accent-grad)" />
  </g>

  <!-- Top-Right Luxury Sparkle Accent -->
  <path d="M380 96 C380 109.255 390.745 120 404 120 C390.745 120 380 130.745 380 144 C380 130.745 369.255 120 356 120 C369.255 120 380 109.255 380 96 Z" fill="#FFFFFF" opacity="0.9" />
</svg>
